<!DOCTYPE html>
<html>
<head>
  <title>Ultimate Resume Builder</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<h1 class="title">🚀 Ultimate Resume Builder</h1>

<div class="container">

  <!-- FORM -->
  <div class="form">

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="role" placeholder="Role">
    <input type="text" id="contact" placeholder="Contact">
    <input type="file" id="photo">

    <input type="text" id="skills" placeholder="Skills (comma separated)">
    <textarea id="education" placeholder="Profile"></textarea>
    <textarea id="experience" placeholder="Experience"></textarea>
    <textarea id="achieve" placeholder="Achievements"></textarea>

    <select id="color">
      <option value="blue">Blue</option>
      <option value="purple">Purple</option>
      <option value="green">Green</option>
      <option value="red">Red</option>
      <option value="dark">Dark</option>
    </select>

    <button onclick="autoGenerateAI()">✨ Auto Generate</button>
    <button onclick="generateResume()">Generate</button>
    <button onclick="downloadPDF()">Download PDF</button>

  </div>

  <!-- RESUME -->
  <div class="resume a4 blue" id="resume">

    <!-- LEFT -->
    <div class="left">
      <img id="pphoto" class="photo">

      <h2 id="pname">Your Name</h2>
      <p id="prole">Role</p>

      <div class="block">
        <h4>Contact</h4>
        <p id="pcontact"></p>
      </div>

      <div class="block">
        <h4>Skills</h4>
        <div id="pskills"></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">

      <div class="card">
        <h3>Profile</h3>
        <p id="pedu"></p>
      </div>

      <div class="card">
        <h3>Experience</h3>
        <p id="pexp"></p>
      </div>

      <div class="card">
        <h3>Achievements</h3>
        <p id="pachieve"></p>
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
